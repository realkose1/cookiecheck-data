# 쿠키이써 데이터 일일 갱신 — 매일 자정(KST) 클라우드에서 돈다.
#
# TMDB 상영작 + KOBIS 관객수(kukiit 프록시) + aftercredits/나무위키 쿠키 대조를
# 돌리고, 결과(cookies.json)를 이 저장소에 커밋한다. 설치된 앱(TestFlight)은
# 실행할 때마다 raw.githubusercontent.com 의 cookies.json 을 읽는다.
#
# 필요한 시크릿:
#   TMDB_READ_TOKEN   (필수) TMDB v4 read access token
#   ANTHROPIC_API_KEY (선택) 새 쿠키 설명 한국어 번역 — 없으면 영어 원문 유지

name: refresh
on:
  schedule:
    - cron: "5 15 * * *"   # 15:05 UTC = 00:05 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul   # date.today() 가 KST 기준이어야 개봉일 필터가 맞는다
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: 번역 SDK (선택 — 키 없으면 영어 유지로 degrade)
        if: env.ANTHROPIC_API_KEY != ''
        run: pip install anthropic

      - name: 데이터 갱신
        run: |
          mkdir -p ios/data   # fetch_movies.py 가 앱 번들용 사본을 여기 쓴다
          python3 tools/sync_aftercredits.py
          python3 tools/fetch_movies.py
          # 앱이 읽는 안정 경로 (COOKIE_FEED_URL = .../main/cookies.json)
          cp ios/data/cookies.json cookies.json

      - name: 커밋
        run: |
          git config user.name "cookiecheck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "data: $(date +%F)"
            git push
          fi
