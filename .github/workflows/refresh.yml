# 쿠키이써 데이터 일일 갱신 — 매일 오전(KST) 클라우드에서 돈다.
#
# TMDB 상영작 + KOBIS 관객수 + aftercredits/mediastinger/나무위키 쿠키 대조를
# 돌리고, 결과(cookies.json)를 이 저장소에 커밋한다. 설치된 앱(TestFlight)은
# 실행할 때마다 raw.githubusercontent.com 의 cookies.json 을 읽는다.
#
# 필수 시크릿
#   TMDB_READ_TOKEN   TMDB v4 read access token
#   KOBIS_API_KEY     영화진흥위원회 오픈API 키 (일별 박스오피스)
#
# 쿠키 설명 한국어 번역 (선택) — 아래 둘 중 하나. 없으면 영어 원문을 유지한다.
#   A. ID 페더레이션 (권장, 고정 키 없음):
#      ANTHROPIC_FEDERATION_RULE_ID / ANTHROPIC_ORGANIZATION_ID /
#      ANTHROPIC_SERVICE_ACCOUNT_ID  (+ 규칙이 여러 워크스페이스를 덮으면 ANTHROPIC_WORKSPACE_ID)
#   B. ANTHROPIC_API_KEY

name: refresh
on:
  schedule:
    # KOBIS 는 전날 집계를 아침에 낸다. 자정에 돌면 이틀 전 집계밖에 못 받는다.
    #
    # 그런데 GitHub 예약 실행은 **정시(:00)에 몰려 크게 밀린다.** 실측하니 매일
    # 4시간 20분씩 늦어, 10:00 KST 로 걸어둔 것이 14:2x KST 에 돌았다. 그 사이
    # 앱에는 이틀 전 집계가 보인다. 그래서 두 가지를 바꿨다:
    #   1) 정시를 피해 한산한 분(:17 / :43 / :11 …)에 건다
    #   2) 두 시간 간격으로 하루 일곱 번 돈다
    #
    # 횟수를 늘린 이유는 따로 있다. KOBIS 가 전날 집계를 내는 시각이 일정하지
    # 않다 — 실측하니 09-12 10:08 실행 때는 아직 전날(9/11) 집계가 없어 9/10 을
    # 받았고, 16:23 실행에서야 9/11 이 들어왔다. 그날 몇 시에 나올지 모르니
    # 시각을 맞추려 하기보다 자주 두드려 나오는 즉시 받는 편이 확실하다.
    #
    # 헛도는 실행이 늘어도 안전하다. fetch_movies.py 가 직전 기준일보다 오래된
    # 값은 버리고, 변경이 없으면 커밋 자체를 건너뛴다.
    - cron: "17 23 * * *"   # 23:17 UTC = 08:17 KST
    - cron: "43 0 * * *"    # 00:43 UTC = 09:43 KST
    - cron: "11 2 * * *"    # 02:11 UTC = 11:11 KST
    - cron: "37 4 * * *"    # 04:37 UTC = 13:37 KST
    - cron: "23 6 * * *"    # 06:23 UTC = 15:23 KST
    - cron: "47 8 * * *"    # 08:47 UTC = 17:47 KST
    - cron: "13 11 * * *"   # 11:13 UTC = 20:13 KST
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # GitHub OIDC 토큰 발급 — ID 페더레이션에 필요

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Seoul   # date.today() 가 KST 기준이어야 개봉일 필터가 맞는다
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}   # 일별 박스오피스 (관객수)
    steps:
      - uses: actions/checkout@v5

      # 쿠키 색인 갱신 (모두 증분). 인증이 필요 없고 가장 오래 걸리므로 먼저 돌려서
      # 아래에서 받는 Anthropic 토큰의 유효 시간을 아낀다.
      #
      # 세 색인은 서로 빈 곳이 다르다 — ac 는 영어권 전반, ms 는 개봉 중 신작이
      # 빠르고, ko 는 나무위키에서 한국·일본 영화를 채운다. 뒤의 둘은 남의 서버
      # 예절(mediastinger robots.txt 는 Crawl-delay 10) 때문에 한 번에 다 훑지
      # 않고 매일 조금씩 이어붙인다.
      #
      # 하루 일곱 번 도는 건 KOBIS 집계를 놓치지 않으려는 것이지 색인 때문이 아니다.
      # 색인은 하루 한 번이면 충분하고, 남의 서버를 일곱 배로 두드릴 이유가 없다.
      # 그래서 아침 첫 예약(과 수동 실행)에서만 돌린다.
      - name: 쿠키 색인 동기화
        if: github.event.schedule == '17 23 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          python3 tools/sync_aftercredits.py
          python3 tools/sync_mediastinger.py
          python3 tools/sync_namu.py --budget 120

      # ID 페더레이션: GitHub OIDC JWT 를 Anthropic 액세스 토큰으로 교환한다.
      # 고정 API 키가 없고, 받은 토큰은 몇 분 뒤 만료된다.
      #
      # 주의 — ANTHROPIC_API_KEY 는 페더레이션보다 우선순위가 높아서, 빈 값이라도
      # 환경에 있으면 페더레이션을 가린다. 그래서 job env 에 두지 않고 여기서
      # 필요한 쪽만 GITHUB_ENV 로 내보낸다.
      - name: Anthropic 인증
        env:
          RULE: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ORG: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          SVAC: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          WS: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$RULE" ]; then
            JWT=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value)
            RESP=$(curl -sS https://api.anthropic.com/v1/oauth/token \
              -H "content-type: application/json" \
              -d "$(jq -nc --arg a "$JWT" --arg r "$RULE" --arg o "$ORG" --arg s "$SVAC" --arg w "$WS" \
                    '{grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer",assertion:$a,
                      federation_rule_id:$r,organization_id:$o,service_account_id:$s}
                     + (if $w == "" then {} else {workspace_id:$w} end)')")
            TOKEN=$(jq -r '.access_token // empty' <<<"$RESP")
            if [ -z "$TOKEN" ]; then
              # 조용히 영어로 degrade 하지 않고 여기서 멈춘다 — 설정이 틀리면
              # 번역이 몇 주 동안 말없이 빠질 수 있기 때문.
              echo "::error::ID 페더레이션 토큰 교환 실패: $(jq -rc '.error // .' <<<"$RESP")"
              exit 1
            fi
            echo "::add-mask::$TOKEN"
            echo "ANTHROPIC_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            echo "TRANSLATE=1" >> "$GITHUB_ENV"
            echo "인증: ID 페더레이션 (토큰 만료 $(jq -r '.expires_in' <<<"$RESP")초)"
          elif [ -n "$KEY" ]; then
            echo "ANTHROPIC_API_KEY=$KEY" >> "$GITHUB_ENV"
            echo "TRANSLATE=1" >> "$GITHUB_ENV"
            echo "인증: API 키"
          else
            echo "인증 없음 — 새 쿠키 설명은 영어 원문을 유지합니다."
          fi

      - name: 번역 SDK
        if: env.TRANSLATE == '1'
        run: pip install anthropic

      - name: 데이터 갱신
        run: |
          mkdir -p ios/data   # fetch_movies.py 가 앱 번들용 사본을 여기 쓴다
          python3 tools/fetch_movies.py
          # 앱이 읽는 안정 경로 (COOKIE_FEED_URL = .../main/cookies.json)
          cp ios/data/cookies.json cookies.json

      - name: 커밋
        run: |
          git config user.name "cookiecheck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "data: $(date +%F)"
            git push
          fi
